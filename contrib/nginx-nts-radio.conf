# NtS-Radio în spatele nginx (HTTPS pe domeniu propriu)
# Copiază în /etc/nginx/conf.d/ (sau include-l în nginx.conf la nginx compilat din sursă),
# înlocuiește radio.domeniu.ro și căile certificatelor, apoi: nginx -t && systemctl reload nginx
# Certificat: certbot certonly --webroot -w /var/www/html -d radio.domeniu.ro
#
# Studioul se conectează în continuare direct pe portul 8000 (și 8001 pentru SHOUTcast).
# În Setări -> "Adresă publică" pune https://radio.domeniu.ro ca linkurile să folosească HTTPS.

server {
    listen 80;
    server_name radio.domeniu.ro;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name radio.domeniu.ro;

    ssl_certificate     /etc/letsencrypt/live/radio.domeniu.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.domeniu.ro/privkey.pem;

    client_max_body_size 1024m;          # upload muzică AutoDJ

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Icy-MetaData $http_icy_metadata;
        proxy_buffering off;              # obligatoriu pentru stream audio
        proxy_request_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}

<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio</title><link rel="icon" id="fav" href="/static/logo.svg">
<style>
:root{--bg:#0f1115;--card:#181b22;--text:#f2f2f0;--muted:#9a9ca3;--accent:#3987e5;--live:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.bgart{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.35);z-index:-1;transition:background-image .6s}
.wrap{max-width:520px;margin:0 auto;padding:28px 18px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.head img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#222}
.head h1{font-size:20px;margin:0}.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.player{background:rgba(24,27,34,.85);backdrop-filter:blur(10px);border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.cwrap{position:relative}.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .3s;border-radius:14px}
.cover{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#222;display:block}
.np{margin:18px 0 6px;font-size:19px;font-weight:650;line-height:1.3;min-height:50px;word-break:break-word}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--live);font-weight:700;font-size:12px;letter-spacing:.5px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.controls{display:flex;align-items:center;gap:16px;margin-top:18px}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s}
.play:active{transform:scale(.95)} .play svg{width:28px;height:28px}
input[type=range]{flex:1;accent-color:var(--accent)}
.hist{margin-top:22px;background:rgba(24,27,34,.75);border-radius:16px;padding:14px 18px}
.hist h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}
#hist > div{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:12px;font-size:14px}
#hist > div:last-child{border:0}#hist span{color:var(--muted);font-variant-numeric:tabular-nums}
.links{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.links a{color:var(--muted);font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:999px}
.links a:hover{color:var(--text)}
/* embed: compact */
body.embed{background:transparent;min-height:0}
body.embed .wrap{padding:0;max-width:none}
body.embed .head,body.embed .hist,body.embed .links,body.embed .bgart{display:none}
body.embed .player{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:14px;background:#181b22}
body.embed .cover,body.embed .cwrap{width:88px;height:88px}
body.embed .np{margin:0 0 4px;font-size:15px;min-height:0}
body.embed .controls{margin:0}
body.embed .vol{display:none}
body.embed .ename{display:block!important;font-size:12px;color:var(--muted);margin-bottom:2px}
</style></head>
<body>
<div class="bgart" id="bg"></div>
<div class="wrap">
  <div class="head"><img id="logo" alt=""><div><h1 id="name"></h1><p id="genre"></p></div></div>
  <div class="player">
    <div class="cwrap"><img class="cover" id="cover" alt=""><canvas id="viz"></canvas></div>
    <div>
      <div class="ename" id="ename" style="display:none"></div>
      <div class="np" id="np">Se încarcă...</div>
      <div class="status" id="status"></div>
    </div>
    <div class="controls">
      <button class="play" id="play" aria-label="Pornește"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <input class="vol" type="range" id="vol" min="0" max="1" step="0.01" value="0.9" aria-label="Volum">
    </div>
  </div>
  <div class="hist" id="histbox"><h2>Ultimele piese</h2><div id="hist"></div></div>
  <div class="links" id="links"></div>
</div>
<audio id="audio" preload="none" crossorigin="anonymous"></audio>
<script src="/static/viz.js"></script>
<script>
const slug = location.pathname.split("/")[2];
const embed = location.pathname.startsWith("/embed/");
if (embed) document.body.classList.add("embed");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const audio = $("audio");
NtsViz.setCanvas($("viz"));
NtsViz.onchange = () => showArt();
let info = null, playing = false, lastTitle = null, logo = "", jingleUntil = 0, songCover = null, shown = null;
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const ICON_LOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9" stroke-dasharray="40 20"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></circle></svg>';

function pickStream() {
  const s = info.streams;
  const mp3 = s.find(x => x.codec === "mp3");
  return (mp3 || s[0]).url;
}
$("play").onclick = () => {
  if (playing) { audio.pause(); audio.removeAttribute("src"); audio.load(); playing = false; $("play").innerHTML = ICON_PLAY; showArt(); return; }
  NtsViz.attach(audio);
  audio.src = pickStream() + "?t=" + Date.now();
  $("play").innerHTML = ICON_LOAD;
  audio.play().then(() => {
    playing = true; $("play").innerHTML = ICON_STOP; showArt();
    if (info && info.intro_secs > 0) { jingleUntil = Date.now() + (info.intro_secs + 1.5) * 1000; showArt(); setTimeout(showArt, (info.intro_secs + 1.6) * 1000); }
  }).catch(() => { $("play").innerHTML = ICON_PLAY; });
};
audio.onerror = () => { if (playing) { setTimeout(() => { if (playing) { audio.src = pickStream() + "?t=" + Date.now(); audio.play().catch(() => {}); } }, 2000); } };
$("vol").oninput = e => { audio.volume = e.target.value; try { localStorage.setItem("vol", e.target.value); } catch (er) {} };
try { const v = localStorage.getItem("vol"); if (v) { $("vol").value = v; audio.volume = v; } } catch (e) {}

async function cover(title) {
  if (!title || (info && (title === info.name || / - LIVE$/.test(title)))) return logo;
  try {
    const r = await fetch("https://itunes.apple.com/search?media=music&entity=song&limit=1&term=" + encodeURIComponent(title.replace(/\(.*?\)|\[.*?\]/g, "")));
    const j = await r.json();
    if (j.results && j.results[0]) return j.results[0].artworkUrl100.replace("100x100", "600x600");
  } catch (e) {}
  return logo;
}
function showArt() {
  if (!info) return;
  const jingle = info.jingle || Date.now() < jingleUntil;
  const c = jingle ? info.jingle_image : (songCover || logo);
  // sigla implicită netstreaming.eu + analiză audio funcțională -> barele se mișcă pe muzică
  const isDef = jingle ? info.jingle_image_default : (c === logo && info.logo_default);
  const useViz = isDef && playing && NtsViz.active;
  NtsViz.show(useViz);
  const src = useViz ? info.viz_bg : c;
  if (src === shown) return;
  shown = src;
  $("cover").src = src; $("bg").style.backgroundImage = `url("${c}")`;
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: jingle ? info.name : info.title, artist: info.name, artwork: [{src: c, sizes: "600x600"}]});
}
async function refresh() {
  try {
    const r = await fetch(`/api/public/${slug}`);
    if (!r.ok) throw 0;
    info = await r.json();
  } catch (e) { return; }
  logo = info.logo;
  document.title = info.name;
  $("name").textContent = info.name; $("ename").textContent = info.name;
  $("genre").textContent = info.genre || info.description || "";
  $("logo").src = logo; $("fav").href = logo;
  $("status").innerHTML = info.live ? `<span class="live">LIVE</span>` : (info.on_air ? "Muzică non-stop" : "Emisia este oprită momentan");
  if (info.title !== lastTitle) {
    lastTitle = info.title;
    $("np").textContent = info.title;
    songCover = await cover(info.title);
  }
  showArt();
  $("hist").innerHTML = info.history.map(h => `<div><span>${new Date(h.ts * 1000).toLocaleTimeString("ro-RO", {hour: "2-digit", minute: "2-digit"})}</span>${esc(h.title)}</div>`).join("") || `<div><span>—</span></div>`;
  $("histbox").style.display = info.history.length ? "" : "none";
  $("links").innerHTML = `<a href="/listen/${slug}.m3u">Deschide în VLC / Winamp (.m3u)</a><a href="/listen/${slug}.pls">.pls</a>` +
    info.streams.map(s => `<a href="${esc(s.url)}" target="_blank">${s.codec.toUpperCase()} ${s.bitrate}k</a>`).join("") +
    (info.website ? `<a href="${esc(info.website)}" target="_blank">Website</a>` : "");
}
refresh(); setInterval(refresh, 5000);
</script>
</body></html>
